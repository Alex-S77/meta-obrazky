name: Meta obrázky

on:
  schedule:
    - cron: "15 3,9,15,21 * * *"   # 4x denne (UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - name: Render images
        run: python generate.py "${{ vars.FEED_URL || 'https://feeds.mergado.com/futbalovysen-sk-facebook-com-sk-844f781c951410ad991176f880c243be.xml' }}" site "${{ steps.pages.outputs.base_url }}"
      - name: Publish preview to branch nahlad
        run: |
          mkdir /tmp/nahlad && cp site/nahlad.jpg site/images.csv /tmp/nahlad/
          cd /tmp/nahlad && git init -q -b nahlad
          git -c user.name=github-actions -c user.email=actions@github.com commit -q --allow-empty -m nahlad
          git add -A && git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Náhľad"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" nahlad
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
