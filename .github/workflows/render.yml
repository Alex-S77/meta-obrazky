name: Meta obrázky

on:
  schedule:
    - cron: "15 * * * *"   # každú hodinu
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - name: Render images
        id: render
        run: python generate.py "${{ vars.FEED_URL || 'https://futbalovysen.sk/?fs_feed=zapasy' }}" site "${{ steps.pages.outputs.base_url }}"
      - name: Publish preview to branch nahlad
        if: steps.render.outputs.skip != 'true'
        # Náhľad je len pomôcka: keď GitHub pri pushi vráti chybu (500, commit_refs),
        # skúsi to znova a ak ani tak nevyjde, beh pokračuje a obrázky sa nasadia.
        continue-on-error: true
        run: |
          mkdir /tmp/nahlad && cp site/nahlad.jpg site/images.csv site/feed-sk.xml /tmp/nahlad/
          cd /tmp/nahlad && git init -q -b nahlad
          git -c user.name=github-actions -c user.email=actions@github.com commit -q --allow-empty -m nahlad
          git add -A && git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Náhľad"
          for wait in 5 15 30 0; do
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" nahlad && exit 0
            [ "$wait" -gt 0 ] && echo "push zlyhal, skúšam znova o ${wait}s" && sleep "$wait"
          done
          echo "::warning::Náhľad (vetva nahlad) sa nepodarilo nahrať, obrázky sa nasadzujú aj tak."
          exit 1
      - uses: actions/upload-pages-artifact@v3
        if: steps.render.outputs.skip != 'true'
        with:
          path: site
      - id: deploy
        if: steps.render.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
